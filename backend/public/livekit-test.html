<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveKit Outbound Call Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 40px;
        max-width: 480px;
        width: 100%;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
        color: #fff;
      }
      .subtitle {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 32px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
        margin-bottom: 20px;
        outline: none;
      }
      input:focus {
        border-color: #4a9eff;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-bottom: 0;
      }
      button {
        padding: 14px;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:disabled {
        background: #333;
        cursor: not-allowed;
      }
      #callBtn {
        flex: 1;
        background: #4a9eff;
      }
      #callBtn:hover:not(:disabled) {
        background: #3a8eef;
      }
      #downloadBtn {
        flex: 0 0 auto;
        background: #2a2a2a;
        border: 1px solid #444;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
      }
      #downloadBtn:hover:not(:disabled) {
        background: #333;
        border-color: #4a9eff;
      }
      #downloadBtn svg {
        flex-shrink: 0;
      }
      .status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
      }
      .status.info {
        display: block;
        background: #1a2a3a;
        border: 1px solid #2a4a6a;
        color: #6ab0ff;
      }
      .status.success {
        display: block;
        background: #1a3a1a;
        border: 1px solid #2a6a2a;
        color: #6aff6a;
      }
      .status.error {
        display: block;
        background: #3a1a1a;
        border: 1px solid #6a2a2a;
        color: #ff6a6a;
      }
      .arch {
        margin-top: 24px;
        padding: 16px;
        background: #111;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.8rem;
        line-height: 1.6;
        color: #888;
      }
      .arch strong {
        color: #4a9eff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LiveKit Outbound Call</h1>
      <p class="subtitle">
        AI agent calls a real PSTN phone via LiveKit Cloud + Twilio SIP
      </p>

      <label for="phone">Phone Number (E.164)</label>
      <input
        type="tel"
        id="phone"
        placeholder="+33612345678"
        value="+33745711753"
      />

      <div class="btn-row">
        <button id="callBtn" onclick="makeCall()">Call Now</button>
        <button id="downloadBtn" onclick="downloadTranscripts()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          PDF
        </button>
      </div>

      <div id="status" class="status"></div>

      <div class="arch">
        <strong>Architecture:</strong><br />
        LiveKit Room (call-hack-1)<br />
        &nbsp;&nbsp;|-- SIP Participant (phone user)<br />
        &nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;via Twilio SIP trunk<br />
        &nbsp;&nbsp;|-- AI Agent (subscribes to audio)<br />
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;audio -> STT -> Claude -> TTS
        -> audio
      </div>
    </div>

    <!-- jsPDF (loaded before module script) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
      import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: "AIzaSyB6eQ-1-LFQTn_6a1dRY6W1IV_IjkqUqcs",
        authDomain: "test-fc608.firebaseapp.com",
        projectId: "test-fc608",
        storageBucket: "test-fc608.firebasestorage.app",
        messagingSenderId: "152500684895",
        appId: "1:152500684895:web:8cf091bb6133f2c33773ea",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ── Call button ──
      window.makeCall = async function () {
        const btn = document.getElementById('callBtn');
        const status = document.getElementById('status');
        const phone = document.getElementById('phone').value.trim();

        if (!phone) {
          status.className = 'status error';
          status.textContent = 'Enter a phone number';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Dialing...';
        status.className = 'status info';
        status.textContent = 'Initiating outbound call via LiveKit SIP...';

        try {
          const res = await fetch('/api/livekit-call', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber: phone }),
          });

          const data = await res.json();

          if (data.success) {
            status.className = 'status success';
            status.textContent = `Call initiated! Agent PID: ${data.pid}. Check server logs for progress.`;
          } else {
            status.className = 'status error';
            status.textContent = `Error: ${data.error}`;
          }
        } catch (err) {
          status.className = 'status error';
          status.textContent = `Network error: ${err.message}`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Call Now';
        }
      };

      // ── PDF Download ──
      window.downloadTranscripts = async function () {
        const btn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');

        btn.disabled = true;
        status.className = 'status info';
        status.textContent = 'Fetching recent conversations...';

        try {
          const q = query(
            collection(db, 'call_transcripts'),
            orderBy('createdAt', 'desc'),
            limit(2),
          );
          const snapshot = await getDocs(q);

          if (snapshot.empty) {
            status.className = 'status error';
            status.textContent = 'No conversations found in database.';
            return;
          }

          const docs = [];
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ unit: 'mm', format: 'a4' });

          const W = pdf.internal.pageSize.getWidth();
          const H = pdf.internal.pageSize.getHeight();
          const margin = 20;
          const contentW = W - margin * 2;
          let y = 0;

          function ensureSpace(needed) {
            if (y + needed > H - margin) {
              pdf.addPage();
              y = margin;
            }
          }

          // ── Cover / Header ──
          // Dark header bar
          pdf.setFillColor(15, 15, 15);
          pdf.rect(0, 0, W, 55, 'F');

          // Accent line
          pdf.setFillColor(74, 158, 255);
          pdf.rect(0, 55, W, 1.5, 'F');

          pdf.setFont('helvetica', 'bold');
          pdf.setFontSize(22);
          pdf.setTextColor(255, 255, 255);
          pdf.text('Conversation Transcripts', margin, 28);

          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(10);
          pdf.setTextColor(150, 150, 150);
          pdf.text(`Generated ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}  \u2022  ${docs.length} conversation${docs.length !== 1 ? 's' : ''}`, margin, 40);

          y = 68;

          // ── Render each conversation ──
          docs.forEach((doc, docIdx) => {
            ensureSpace(30);

            // Conversation header pill
            pdf.setFillColor(26, 26, 26);
            pdf.roundedRect(margin, y - 2, contentW, 14, 3, 3, 'F');
            pdf.setFillColor(74, 158, 255);
            pdf.roundedRect(margin, y - 2, 3, 14, 1.5, 1.5, 'F');

            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(12);
            pdf.setTextColor(74, 158, 255);
            pdf.text(`Conversation ${docIdx + 1}`, margin + 8, y + 7);

            // Timestamp on the right
            const ts = doc.createdAt?.toDate?.()
              ? doc.createdAt.toDate()
              : doc.createdAt?.seconds
                ? new Date(doc.createdAt.seconds * 1000)
                : doc.createdAt ? new Date(doc.createdAt) : null;

            if (ts) {
              pdf.setFont('helvetica', 'normal');
              pdf.setFontSize(8);
              pdf.setTextColor(120, 120, 120);
              const tsStr = ts.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
              pdf.text(tsStr, W - margin, y + 7, { align: 'right' });
            }

            y += 20;

            // Messages
            const messages = doc.messages || doc.transcript || [];
            messages.forEach((msg) => {
              ensureSpace(18);
              const role = msg.role || msg.speaker || 'unknown';
              const text = msg.content || msg.text || '';
              const isUser = role === 'user' || role === 'caller';

              // Role label
              pdf.setFont('helvetica', 'bold');
              pdf.setFontSize(8);
              pdf.setTextColor(isUser ? 160 : 74, isUser ? 160 : 158, isUser ? 160 : 255);
              pdf.text(isUser ? 'CALLER' : 'COUNSELLOR', margin + 2, y);
              y += 5;

              // Message bubble background
              const lines = pdf.setFont('helvetica', 'normal')
                .setFontSize(10)
                .splitTextToSize(text, contentW - 12);
              const blockH = lines.length * 5 + 6;

              ensureSpace(blockH + 4);

              if (isUser) {
                pdf.setFillColor(34, 34, 40);
              } else {
                pdf.setFillColor(20, 35, 50);
              }
              pdf.roundedRect(margin, y - 2, contentW, blockH, 2, 2, 'F');

              pdf.setTextColor(210, 210, 210);
              pdf.text(lines, margin + 6, y + 4);
              y += blockH + 6;
            });

            // Divider between conversations
            if (docIdx < docs.length - 1) {
              y += 4;
              ensureSpace(10);
              pdf.setDrawColor(50, 50, 50);
              pdf.setLineWidth(0.3);
              pdf.line(margin + 20, y, W - margin - 20, y);
              y += 10;
            }
          });

          // ── Footer on last page ──
          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(7);
          pdf.setTextColor(100, 100, 100);
          pdf.text('AI Counsellor  \u2022  Confidential', W / 2, H - 10, { align: 'center' });

          pdf.save('conversation-transcripts.pdf');

          status.className = 'status success';
          status.textContent = `Downloaded ${docs.length} conversation(s) as PDF.`;
        } catch (err) {
          console.error(err);
          status.className = 'status error';
          status.textContent = `Download failed: ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
