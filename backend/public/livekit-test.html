<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveKit Outbound Call Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 40px;
        max-width: 480px;
        width: 100%;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
        color: #fff;
      }
      .subtitle {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 32px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
        margin-bottom: 20px;
        outline: none;
      }
      input:focus {
        border-color: #4a9eff;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #4a9eff;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #3a8eef;
      }
      button:disabled {
        background: #333;
        cursor: not-allowed;
      }
      .status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
      }
      .status.info {
        display: block;
        background: #1a2a3a;
        border: 1px solid #2a4a6a;
        color: #6ab0ff;
      }
      .status.success {
        display: block;
        background: #1a3a1a;
        border: 1px solid #2a6a2a;
        color: #6aff6a;
      }
      .status.error {
        display: block;
        background: #3a1a1a;
        border: 1px solid #6a2a2a;
        color: #ff6a6a;
      }
      .arch {
        margin-top: 24px;
        padding: 16px;
        background: #111;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.8rem;
        line-height: 1.6;
        color: #888;
      }
      .arch strong {
        color: #4a9eff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LiveKit Outbound Call</h1>
      <p class="subtitle">
        AI agent calls a real PSTN phone via LiveKit Cloud + Twilio SIP
      </p>

      <label for="phone">Phone Number (E.164)</label>
      <input
        type="tel"
        id="phone"
        placeholder="+33612345678"
        value="+33745711753"
      />

      <button id="callBtn" onclick="makeCall()">Call Now</button>

      <div id="status" class="status"></div>

      <div class="arch">
        <strong>Architecture:</strong><br />
        LiveKit Room (call-hack-1)<br />
        &nbsp;&nbsp;|-- SIP Participant (phone user)<br />
        &nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;via Twilio SIP trunk<br />
        &nbsp;&nbsp;|-- AI Agent (subscribes to audio)<br />
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;audio -> STT -> Claude -> TTS
        -> audio
      </div>
    </div>

    <script>
      async function makeCall() {
        const btn = document.getElementById('callBtn');
        const status = document.getElementById('status');
        const phone = document.getElementById('phone').value.trim();

        if (!phone) {
          status.className = 'status error';
          status.textContent = 'Enter a phone number';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Dialing...';
        status.className = 'status info';
        status.textContent = 'Initiating outbound call via LiveKit SIP...';

        try {
          const res = await fetch('/api/livekit-call', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber: phone }),
          });

          const data = await res.json();

          if (data.success) {
            status.className = 'status success';
            status.textContent = `Call initiated! Agent PID: ${data.pid}. Check server logs for progress.`;
          } else {
            status.className = 'status error';
            status.textContent = `Error: ${data.error}`;
          }
        } catch (err) {
          status.className = 'status error';
          status.textContent = `Network error: ${err.message}`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Call Now';
        }
      }
    </script>
  </body>
</html>
