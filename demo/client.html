<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dementia Care Voice Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 2rem;
    }
    h1 { color: #e94560; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
    .status {
      padding: 0.5rem 1.5rem; border-radius: 2rem; font-weight: bold;
      margin-bottom: 1.5rem; font-size: 0.9rem;
    }
    .status.disconnected { background: #333; color: #888; }
    .status.connecting { background: #4a3f00; color: #ffd700; }
    .status.connected { background: #003d00; color: #00ff41; }
    .status.listening { background: #1a0040; color: #b388ff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
    button {
      padding: 1rem 3rem; font-size: 1.2rem; border: none; border-radius: 3rem;
      cursor: pointer; transition: all 0.3s;
    }
    #connectBtn { background: #e94560; color: white; }
    #connectBtn:hover { background: #c73e54; transform: scale(1.05); }
    #connectBtn:disabled { background: #555; cursor: not-allowed; transform: none; }
    #disconnectBtn { background: #333; color: #e94560; display: none; margin-top: 1rem; padding: 0.5rem 2rem; font-size: 0.9rem; }
    .transcript {
      width: 100%; max-width: 600px; margin-top: 2rem;
      background: #16213e; border-radius: 1rem; padding: 1.5rem;
      max-height: 400px; overflow-y: auto;
    }
    .transcript h3 { color: #e94560; margin-bottom: 1rem; }
    .msg { margin-bottom: 0.8rem; padding: 0.5rem 0; border-bottom: 1px solid #222; }
    .msg .speaker { font-weight: bold; font-size: 0.85rem; }
    .msg .speaker.user { color: #4fc3f7; }
    .msg .speaker.agent { color: #e94560; }
    .msg .text { margin-top: 0.3rem; color: #ccc; font-size: 0.9rem; }
    .msg .meta { color: #666; font-size: 0.75rem; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <h1>Dementia Care Voice Agent</h1>
  <p class="subtitle">Speechmatics + Backboard AI | Pipecat Pipeline</p>
  <div id="status" class="status disconnected">Disconnected</div>
  <button id="connectBtn" onclick="connect()">Start Conversation</button>
  <button id="disconnectBtn" onclick="disconnect()">End Conversation</button>
  <div class="transcript" id="transcript">
    <h3>Conversation</h3>
  </div>

  <script>
    let ws, audioContext, micStream, micProcessor, playQueue = [], isPlaying = false;
    const WS_URL = 'ws://localhost:8765';

    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + cls;
    }

    function addMessage(speaker, text) {
      const div = document.createElement('div');
      div.className = 'msg';
      const time = new Date().toLocaleTimeString();
      div.innerHTML = `
        <span class="speaker ${speaker === 'You' ? 'user' : 'agent'}">${speaker}</span>
        <span class="meta">${time}</span>
        <div class="text">${text}</div>
      `;
      document.getElementById('transcript').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    async function connect() {
      document.getElementById('connectBtn').disabled = true;
      setStatus('Connecting...', 'connecting');

      try {
        audioContext = new AudioContext({ sampleRate: 16000 });
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
        });
        micStream = stream;

        ws = new WebSocket(WS_URL);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          setStatus('Connected - Speak now', 'connected');
          document.getElementById('disconnectBtn').style.display = 'inline-block';
          startMicCapture(stream);
          addMessage('System', 'Connected to voice agent');
        };

        ws.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            playAudio(event.data);
          } else {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'transcript' && msg.data) {
                if (msg.data.user) addMessage('You', msg.data.user);
                if (msg.data.agent) addMessage('Sarah', msg.data.agent);
              }
            } catch(e) {}
          }
        };

        ws.onclose = () => {
          setStatus('Disconnected', 'disconnected');
          cleanup();
        };

        ws.onerror = (e) => {
          setStatus('Connection error', 'disconnected');
          cleanup();
        };

      } catch (e) {
        setStatus('Mic access denied', 'disconnected');
        document.getElementById('connectBtn').disabled = false;
      }
    }

    function startMicCapture(stream) {
      const source = audioContext.createMediaStreamSource(stream);
      micProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      micProcessor.onaudioprocess = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          const float32 = e.inputBuffer.getChannelData(0);
          const int16 = new Int16Array(float32.length);
          for (let i = 0; i < float32.length; i++) {
            int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
          }
          ws.send(int16.buffer);
        }
      };

      source.connect(micProcessor);
      micProcessor.connect(audioContext.destination);
      setStatus('Listening...', 'listening');
    }

    function playAudio(arrayBuffer) {
      playQueue.push(arrayBuffer);
      if (!isPlaying) processPlayQueue();
    }

    async function processPlayQueue() {
      isPlaying = true;
      while (playQueue.length > 0) {
        const buffer = playQueue.shift();
        try {
          const audioBuffer = await audioContext.decodeAudioData(buffer.slice(0));
          const source = audioContext.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioContext.destination);
          source.start();
          await new Promise(r => source.onended = r);
        } catch(e) {
          // Try as raw PCM
          const int16 = new Int16Array(buffer);
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
          const ab = audioContext.createBuffer(1, float32.length, 16000);
          ab.copyToChannel(float32, 0);
          const src = audioContext.createBufferSource();
          src.buffer = ab;
          src.connect(audioContext.destination);
          src.start();
          await new Promise(r => src.onended = r);
        }
      }
      isPlaying = false;
    }

    function disconnect() {
      if (ws) ws.close();
      cleanup();
    }

    function cleanup() {
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (micProcessor) micProcessor.disconnect();
      document.getElementById('connectBtn').disabled = false;
      document.getElementById('disconnectBtn').style.display = 'none';
    }
  </script>
</body>
</html>
